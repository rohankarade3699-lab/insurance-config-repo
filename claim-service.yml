spring:
  application:
    name: claim-service

  datasource:
    #url: jdbc:postgresql://localhost:5432/new_user_db
    url: jdbc:postgresql://host.docker.internal:5432/new_claim_db
    username: postgres
    password: Postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # kafka:
  #   bootstrap-servers: kafka:9092

  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  tracing:
    sampling:
      probability: 1.0

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
      #defaultZone: http://localhost:8761/eureka/
