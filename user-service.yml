spring:
  application:
    name: user-service

  datasource:
    #url: jdbc:postgresql://localhost:5432/new_user_db
    url: jdbc:postgresql://host.docker.internal:5432/new_user_db
    username: postgres
    password: Postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


management:
  tracing:
    sampling:
      probability: 1.0

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/